name: Continuous Integration

"on":
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    ci:
        name: Run the tests suite (PHP ${{ matrix.php-versions }}, ${{ matrix.dependencies }} deps)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-versions:
                    - "8.3"
                    - "8.4"
                    - "8.5"
                    - "8.6"
                dependencies:
                    - "highest"
                include:
                    - php-versions: "8.3"
                      dependencies: "lowest"
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ matrix.php-versions }}"

            - name: Setup Castor
              uses: castor-php/setup-castor@v1.1.0

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Install dependencies
              run: castor install

            - name: Downgrade to the lowest supported dependencies
              if: matrix.dependencies == 'lowest'
              run: composer update -n --prefer-dist --prefer-lowest --prefer-stable

            - name: Install quality tools
              run: castor qa:install

            # Annotations differ between dependency versions; analyse against the highest ones only
            - name: Run PHPStan
              if: matrix.dependencies == 'highest'
              run: castor qa:phpstan

            - name: Run tests
              run: castor qa:phpunit

    cs:
        name: Check PHP coding standards
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3

            - name: Setup Castor
              uses: castor-php/setup-castor@v1.1.0

            - name: Install dependencies
              run: castor install

            - name: Install quality tools
              run: castor qa:install --only php-cs-fixer

            - name: Check coding standards
              run: castor qa:cs --dry-run
